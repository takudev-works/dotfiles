name: Refactor

on:
  schedule:
    # 日本時間（毎月 15 日 9:00）で書かないのは、schedule の cron が UTC で動くため
    - cron: '0 0 15 * *'
  workflow_dispatch:

jobs:
  refactor:
    uses: takudev-works/dev-config/.github/workflows/reusable-refactor.yml@afa2aa09de5dcd39b56216fe1c6ea87bb8502e5f # v9.2.7
    secrets:
      ORG_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.ORG_CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
