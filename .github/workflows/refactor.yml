name: Refactor

on:
  schedule:
    # 日本時間（毎月 15 日 9:00）で書かないのは、schedule の cron が UTC で動くため
    - cron: '0 0 15 * *'
  workflow_dispatch:

jobs:
  refactor:
    uses: takudev-works/dev-config/.github/workflows/reusable-refactor.yml@476dba7c9cde0d57af65f476c570b2e39878c3d7 # v9.3.2
    secrets:
      ORG_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.ORG_CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
