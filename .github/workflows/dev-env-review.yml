name: Dev env review

on:
  schedule:
    # 日本時間（毎月 1 日 9:00）で書かないのは、schedule の cron が UTC で動くため
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  dev-env-review:
    uses: takudev-works/dev-config/.github/workflows/reusable-dev-env-review.yml@4c4b38542b75cdd3a3739334f4744ef7554a89b6 # v9.2.8
    secrets:
      ORG_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.ORG_CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
