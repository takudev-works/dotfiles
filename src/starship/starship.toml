add_newline = true

[package]
disabled = true

[aws.region_aliases]
ap-northeast-1 = "jp"

# starship の条件付きの括弧は中の変数が 1 つでも空でなければ出るので、$region を入れると未ログインでも出てしまう
[gcloud]
format = '(on [$symbol$account(@$domain)]($style) )'

[memory_usage]
disabled = false
threshold = -1
style = "bold dimmed blue"
format = "[ram${ram_pct}/swap${swap_pct}]($style) "

[git_status]
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"

[cmd_duration]
min_time = 500
format = "exec time [$duration](bold yellow)"
