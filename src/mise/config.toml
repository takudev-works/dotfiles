[tools]
# 言語
python = "3.15.2"
node = "26.13.0"
go = "1.27.3"
ruby = "4.0.9"
rust = "1.99.1"
deno = "2.9.8"

# パッケージマネージャ
pnpm = "12.17.0"
yarn = "1.22.19"
bun = "1.4.4"
uv = "0.13.6"

# クラウド
awscli = "2.39.3"
gcloud = "589.0.0"
terraform = "1.17.1"
terragrunt = "1.2.1"
firebase = "15.34.2"

# 開発
direnv = "2.38.2"

[tasks.dotfiles]
description = "dotfiles の init.sh を動かす。ツール名を付けると、その setup.sh だけを動かす（例: mise run dotfiles homebrew）"
# dotfiles の場所を書かないのは、このファイルが dotfiles の src/mise/config.toml へのリンクで、リンク先からたどれるため
run = 'bash "$(dirname "$(readlink -f "$HOME/.config/mise/config.toml")")/../../init.sh"'

[settings]
legacy_version_file = true
python.github_attestations = false
